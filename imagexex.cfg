# NexiaCompiler — imagexex.exe configuration file
# This file is passed to imagexex.exe via /CONFIGFILE: when building XEX output.
# Settings here control XEX metadata for RGH/devkit consoles.
#
# Usage:
#   imagexex.exe /NOCOMPRESS /CONFIGFILE:imagexex.cfg /IN:output.exe /OUT:output.xex
#
# For custom builds, copy this file and modify as needed, then pass via --xex-config.

[XEX]
# Title ID — unique identifier for your homebrew title
# Use 0xFFFFFFFF for development/testing, or assign your own for release
TITLEID  = 0xFFFFFFFF

# Title name shown in dashboard (max 40 chars)
TITLENAME = NexiaCompiler Output

# Image base address — standard Xbox 360 executable base
BASEADDR = 0x82000000

# System flags — 0 for homebrew (no special privileges needed)
SYSFLAG  = 0x00000000

# Stack size — 256KB is the standard minimum for Xbox 360
STACK    = 0x40000

# Heap size — 1MB default
HEAP     = 0x100000

# Game region — 0xFFFFFFFF = region-free
GAMEREGION = 0xFFFFFFFF

# Media ID — 0 for homebrew
MEDIAID  = 0x00000000
